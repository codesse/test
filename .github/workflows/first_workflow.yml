# first workflow
name: First Workflow
on:
  push:
    branches: 
      - main
  workflow_dispatch:
jobs:
  first_job:
    name: First Job
    runs-on: ubuntu-latest
    steps:
      - name: Greetings
        run: |
          echo "Hello world from ${{ github.actor }}."
          echo "Current branch is  ${{ github.ref }}."
          echo "Hello ${{ vars.WHO_TO_GREET }} from ${{ github.actor }}."
          echo "My secret is ${{ secrets.MY_SECRET }}."
        shell: bash
      - name: Checkout
        uses: actions/checkout@v4.2.2
      - run: tree
